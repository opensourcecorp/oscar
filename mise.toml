[settings]
experimental = true
jobs = 4

[tools]
buf = "1.57.2"
github-cli = "2.79.0"
go = "1.25.5"
hadolint = "2.13.1"
markdownlint-cli2 = "0.20.0"
# required for markdownlint-cli2
node = "24.8.0"
protobuf = "32.1"
python = "3.13.7"
ripgrep = "14.1.1"
shellcheck = "0.11.0"
shfmt = "3.12.0"
terraform = "1.13.3"
upx = "5.0.2"
uv = "0.8.18"
yamlfmt = "0.17.2"
yamllint = "1.37.1"

### Go-specific tools, for oscar or its development
"github:golangci/golangci-lint" = { version = "2.6.2" }
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.1.4" }
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = { version = "1.36.8" }

### Python-specific tools. Note that others that may also be CLI tools, may be run internally via
### `uvx` instead.
ruff = "0.13.1"
# ty = "0.0.5" # NOTE: not in registry at the time of this writing, will need to run with uvx
