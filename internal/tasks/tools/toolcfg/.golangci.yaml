# NOTE: modified based on defaults found at:
# https://golangci-lint.run/docs/configuration/file
---
version: 2
linters:
  # Disable all so we can then enable just the ones we want
  default: "none"
  enable:
    # - "arangolint"
    # - "asasalint"
    # - "asciicheck"
    # - "bidichk"
    # - "bodyclose"
    # - "canonicalheader"
    # - "containedctx"
    # - "contextcheck"
    # - "copyloopvar"
    # - "cyclop"
    # - "decorder"
    # - "depguard"
    # - "dogsled"
    # - "dupl"
    # - "dupword"
    # - "durationcheck"
    # - "embeddedstructfieldcheck"
    # - "err113"
    - "errcheck"
    # - "errchkjson"
    # - "errname"
    # - "errorlint"
    # - "exhaustive"
    # - "exhaustruct"
    # - "exptostd"
    # - "fatcontext"
    # - "forbidigo"
    # - "forcetypeassert"
    # - "funcorder"
    # - "funlen"
    # - "ginkgolinter"
    # - "gocheckcompilerdirectives"
    # - "gochecknoglobals"
    # - "gochecknoinits"
    # - "gochecksumtype"
    # - "gocognit"
    # - "goconst"
    # - "gocritic"
    # - "gocyclo"
    - "godoclint"
    # - "godot"
    # - "godox"
    # - "goheader"
    # - "gomoddirectives"
    # - "gomodguard"
    # - "goprintffuncname"
    # - "gosec"
    # - "gosmopolitan"
    - "govet"
    # - "grouper"
    # - "iface"
    # - "importas"
    # - "inamedparam"
    # - "ineffassign"
    # - "interfacebloat"
    # - "intrange"
    # - "iotamixing"
    # - "ireturn"
    # - "lll"
    # - "loggercheck"
    # - "maintidx"
    # - "makezero"
    # - "mirror"
    # - "misspell"
    # - "mnd"
    # - "modernize"
    # - "musttag"
    # - "nakedret"
    # - "nestif"
    # - "nilerr"
    # - "nilnesserr"
    # - "nilnil"
    # - "nlreturn"
    # - "noctx"
    # - "noinlineerr"
    # - "nolintlint"
    # - "nonamedreturns"
    # - "nosprintfhostport"
    # - "paralleltest"
    # - "perfsprint"
    # - "prealloc"
    # - "predeclared"
    # - "promlinter"
    - "protogetter"
    # - "reassign"
    # - "recvcheck"
    - "revive"
    # - "rowserrcheck"
    # - "sloglint"
    # - "spancheck"
    # - "sqlclosecheck"
    - "staticcheck"
    # - "tagalign"
    # - "tagliatelle"
    # - "testableexamples"
    # - "testifylint"
    # - "testpackage"
    # - "thelper"
    # - "tparallel"
    # - "unconvert"
    # - "unparam"
    # - "unqueryvet"
    # - "unused"
    # - "usestdlibvars"
    # - "usetesting"
    # - "varnamelen"
    # - "wastedassign"
    # - "whitespace"
    # - "wrapcheck"
    # - "wsl_v5"
    # - "zerologlint"
  disable: []
  # See: https://golangci-lint.run/docs/linters/configuration
  settings:
    revive:
      confidence: 0.8
      errorCode: 1
      warningCode: 1
      ignoreGeneratedHeader: false
      severity: "warning"
      rules:
        - name: "increment-decrement"
          disabled: true
    staticcheck:
      checks:
        - "all"
        # staticcheck won't ignore generated code for this one, so revive handles this check instead
        - "-ST1000"
  exclusions:
    # See: https://go.dev/s/generatedcode
    generated: "strict"

formatters:
  enable:
    # - "gci"
    - "gofmt"
    # - "gofumpt"
    - "goimports"
    # - "golines"
    # - "swaggo"
  # See: https://golangci-lint.run/docs/formatters/configuration
  settings: {}
  exclusions:
    generated: "strict"

issues:
  new: false
  # new-from-merge-base: main
  fix: true

output: {}

run:
  timeout: 0
  relative-path-mode: "gomod"
  allow-parallel-runners: true
  allow-serial-runners: true

severity:
  default: "warning"
